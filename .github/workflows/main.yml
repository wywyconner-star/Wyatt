name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windowsa
            os: windows-latest

          - name: macOS
            os: macos-latest

          - name: iOS
            os: macos-latest
            target: iOS

          - name: Android32
            os: ubuntu-latest
            target: Android32

          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Clone compatible 2.2081 bindings
        run: |
          git clone [github.com](https://github.com/geode-sdk/bindings.git) "${{ github.workspace }}/bindings-repo"
          cd "${{ github.workspace }}/bindings-repo"
          git checkout 7407717c307d1cd94461786210b330ab868f4260
          echo "GEODE_BINDINGS_REPO_PATH=${{ github.workspace }}/bindings-repo" >> $GITHUB_ENV

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}
          configure-args: -DSKIP_BUILDING_CODEGEN=OFF

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
